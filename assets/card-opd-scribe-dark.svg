<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img" aria-label="OPD Scribe: AI scribe that turns doctor–patient consultations in Indian languages into transcripts, summaries and SOAP notes.">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#f472b6" stop-opacity=".22"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace}
    .title{font-size:24px;font-weight:700;fill:#e6edf3;letter-spacing:-.3px}
    .kind{font-size:12px;font-weight:600;fill:#f472b6;letter-spacing:1.6px}
    .desc{font-size:15.5px;fill:#8b949e}
    .chip{font-size:12px;fill:#c9d1d9}
    .stat{font-size:11.5px;font-weight:700;letter-spacing:1px;fill:#e6edf3}
    .in{opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}
    .i2{animation-delay:.15s} .i3{animation-delay:.3s} .i4{animation-delay:.45s}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .trace{stroke-dasharray:1580;stroke-dashoffset:1580;animation:trace 2.2s cubic-bezier(.6,0,.2,1) .1s forwards}
    @keyframes trace{to{stroke-dashoffset:0}}
    .arrow{animation:nudge 2.4s ease-in-out infinite}
    @keyframes nudge{0%,70%,100%{transform:none}80%{transform:translate(3px,-3px)}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
    .breathe{animation:breathe 6s ease-in-out infinite}
    @keyframes breathe{50%{opacity:.55}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect x="1" y="1" width="558" height="238" rx="18" fill="#161b22" stroke="#30363d"/>
  <rect class="breathe" x="1" y="1" width="558" height="238" rx="18" fill="url(#glow)"/>
  <rect class="trace" x="1" y="1" width="558" height="238" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.6"/>
  <text x="32" y="44" class="sans kind in">HEALTHCARE · SPEECH AI</text>
  <text x="32" y="76" class="sans title in i2">OPD Scribe</text>
  <g class="in i2">
    <rect x="349" y="28" width="143" height="24" rx="12" fill="#1f2630" stroke="#30363d"/>
    
    <circle cx="361" cy="40" r="4" fill="#8b949e"/>
    <text x="371" y="44.5" class="mono stat">IN PRODUCTION</text>
  </g>
  
  <g class="in i3"><text x="32" y="104" class="sans desc">AI scribe that turns doctor–patient consultations in Indian</text><text x="32" y="128" class="sans desc">languages into transcripts, summaries and SOAP notes.</text></g>
  <g class="in i4"><rect x="32" y="186" width="72" height="26" rx="13" fill="#1f2630" stroke="#30363d"/><text x="68.0" y="203.5" text-anchor="middle" class="mono chip">Node.js</text><rect x="112" y="186" width="128" height="26" rx="13" fill="#1f2630" stroke="#30363d"/><text x="176.0" y="203.5" text-anchor="middle" class="mono chip">Speech-to-text</text><rect x="248" y="186" width="48" height="26" rx="13" fill="#1f2630" stroke="#30363d"/><text x="272.0" y="203.5" text-anchor="middle" class="mono chip">LLMs</text></g>
</svg>