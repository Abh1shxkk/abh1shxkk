<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Hi, I'm Abhishek Chauhan — Laravel and backend developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f6fb"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#6d4aff"/><stop offset="0.5" stop-color="#0891b2"/><stop offset="1" stop-color="#6d4aff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#e3e8ef"/>
      <animateTransform attributeName="patternTransform" type="translate" values="0 0;24 24" dur="8s" repeatCount="indefinite"/>
    </pattern>
    <radialGradient id="orbA"><stop offset="0" stop-color="#6d4aff" stop-opacity=".35"/><stop offset="1" stop-color="#6d4aff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#0891b2" stop-opacity=".28"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace}
    .hello{font-size:22px;fill:#59636e;font-weight:500}
    .big{font-size:52px;font-weight:800;letter-spacing:-1.5px}
    .role-text{font-size:21px;fill:#1f2328}
    .pill{font-size:14px;fill:#1f2328;font-weight:600}
    .code{font-size:15px} .kw{fill:#cf222e} .st{fill:#0a3069} .fn{fill:#8250df} .tx{fill:#1f2328} .lnum{fill:#59636e;opacity:.6}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
    .d1{animation-delay:.1s} .d2{animation-delay:.3s} .d3{animation-delay:.5s} .d4{animation-delay:.4s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .wave{transform-box:fill-box;transform-origin:70% 80%;animation:wave 2.6s ease-in-out 1s infinite}
    @keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
    .role{opacity:0;animation:roleFade 12s infinite}
    .r1{animation-delay:4s} .r2{animation-delay:8s}
    @keyframes roleFade{0%{opacity:1}30%{opacity:1}33.3%{opacity:0}100%{opacity:0}}
    .typer{animation:type 12s steps(42,end) infinite}
    .t1{animation-delay:4s} .t2{animation-delay:8s}
    @keyframes type{0%{width:0}12%{width:560px}100%{width:560px}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
    .floatA{animation:floatA 14s ease-in-out infinite} .floatB{animation:floatB 18s ease-in-out infinite}
    @keyframes floatA{50%{transform:translate(60px,30px)}} @keyframes floatB{50%{transform:translate(-70px,-20px)}}
    .ln{opacity:0;animation:rise .5s ease-out forwards}
    .win{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) .3s forwards}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <circle class="floatA" cx="180" cy="40" r="260" fill="url(#orbA)"/>
    <circle class="floatB" cx="1050" cy="280" r="280" fill="url(#orbB)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="20" fill="none" stroke="#d0d7de"/>

  <g class="rise d1">
    <rect x="64" y="40" width="262" height="32" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle class="pulse" cx="84" cy="56" r="5" fill="#059669"/>
    <circle cx="84" cy="56" r="5" fill="#059669"/>
    <text x="98" y="61" class="sans pill">Open to interesting projects</text>
  </g>
  <text x="64" y="112" class="sans hello rise d2">Hi there, I'm</text>
  <g class="rise d3">
    <text x="62" y="166" class="sans big" fill="url(#name)">Abhishek Chauhan</text>
    <text x="530" y="160" font-size="42" class="wave">👋</text>
  </g>
  
    <g class="role r0">
      <clipPath id="c0"><rect class="typer t0" x="64" y="186" width="0" height="34"/></clipPath>
      <text x="64" y="211" class="mono role-text" clip-path="url(#c0)"><tspan fill="#059669">❯</tspan> Laravel &amp; PHP backend developer</text>
    </g>
    <g class="role r1">
      <clipPath id="c1"><rect class="typer t1" x="64" y="186" width="0" height="34"/></clipPath>
      <text x="64" y="211" class="mono role-text" clip-path="url(#c1)"><tspan fill="#059669">❯</tspan> building dashboards, APIs &amp; AI tools</text>
    </g>
    <g class="role r2">
      <clipPath id="c2"><rect class="typer t2" x="64" y="186" width="0" height="34"/></clipPath>
      <text x="64" y="211" class="mono role-text" clip-path="url(#c2)"><tspan fill="#059669">❯</tspan> React · FastAPI · Docker in production</text>
    </g>
  <rect class="caret" x="64" y="236" width="0" height="0"/>
  <text x="64" y="262" class="sans rise d4" font-size="15" fill="#59636e">Full-stack web developer · Global Matrix Solution · Meerut, India</text>

  <g class="win">
    <rect x="772" y="60" width="368" height="200" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="796" cy="82" r="5.5" fill="#ff5f57"/><circle cx="814" cy="82" r="5.5" fill="#febc2e"/><circle cx="832" cy="82" r="5.5" fill="#28c840"/>
    <text x="1120" y="87" text-anchor="end" class="mono" font-size="12" fill="#59636e">dev.ts</text>
    <line x1="772" y1="100" x2="1140" y2="100" stroke="#d0d7de"/>
    <text x="800" y="128" class="mono code ln" xml:space="preserve" style="animation-delay:0.60s"><tspan class="lnum">1</tspan>  <tspan class="kw">const </tspan><tspan class="fn">dev</tspan><tspan class="tx"> = {</tspan></text><text x="800" y="152" class="mono code ln" xml:space="preserve" style="animation-delay:0.85s"><tspan class="lnum">2</tspan>  <tspan class="tx">  name: </tspan><tspan class="st">'Abhishek Chauhan'</tspan><tspan class="tx">,</tspan></text><text x="800" y="176" class="mono code ln" xml:space="preserve" style="animation-delay:1.10s"><tspan class="lnum">3</tspan>  <tspan class="tx">  stack: [</tspan><tspan class="st">'Laravel'</tspan><tspan class="tx">, </tspan><tspan class="st">'React'</tspan><tspan class="tx">],</tspan></text><text x="800" y="200" class="mono code ln" xml:space="preserve" style="animation-delay:1.35s"><tspan class="lnum">4</tspan>  <tspan class="tx">  ships: </tspan><tspan class="st">'to production'</tspan><tspan class="tx">,</tspan></text><text x="800" y="224" class="mono code ln" xml:space="preserve" style="animation-delay:1.60s"><tspan class="lnum">5</tspan>  <tspan class="tx">  based: </tspan><tspan class="st">'Meerut, IN'</tspan></text><text x="800" y="248" class="mono code ln" xml:space="preserve" style="animation-delay:1.85s"><tspan class="lnum">6</tspan>  <tspan class="tx">};</tspan></text>
    <rect class="caret" x="836" y="236" width="9" height="18" fill="#0891b2" style="opacity:1"/>
  </g>
</svg>