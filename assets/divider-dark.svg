<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <rect x="0" y="11" width="1200" height="1.5" fill="#30363d"/>
  <rect x="0" y="10.5" width="1200" height="2.5" rx="1" fill="url(#g)"/>
  <circle cx="600" cy="12" r="4" fill="#22d3ee">
    <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>